<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLA Dashboard — CE Monitoreo</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1017'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%233b82f6' stroke-width='2.5'/%3E%3Cpath d='M16 10v6l4 2' stroke='%233b82f6' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%233b82f6'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #070910;
  --bg2:      #0d1017;
  --bg3:      #131720;
  --bg4:      #1c2230;
  --border:   rgba(255,255,255,0.06);
  --border2:  rgba(255,255,255,0.12);
  --text:     #e4e8f0;
  --text2:    #7a8299;
  --text3:    #3d4560;
  --accent:   #3b82f6;
  --green:    #10b981;
  --amber:    #f59e0b;
  --red:      #ef4444;
  --mon:      #a78bfa;
  --inc:      #34d399;
  --r:        10px;
  --r-sm:     6px;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:'Outfit',sans-serif; font-size:14px; min-height:100vh; overflow-x:hidden; }

/* GRID BG */
body::before {
  content:'';
  position:fixed; inset:0;
  background: radial-gradient(ellipse 80% 50% at 20% -10%, rgba(59,130,246,0.08) 0%, transparent 60%),
              radial-gradient(ellipse 60% 40% at 80% 110%, rgba(167,139,250,0.06) 0%, transparent 60%);
  pointer-events:none; z-index:0;
}

/* LAYOUT */
.sidebar {
  position:fixed; left:0; top:0; bottom:0; width:210px;
  background:var(--bg2); border-right:1px solid var(--border);
  display:flex; flex-direction:column; z-index:100;
}
.logo { padding:22px 18px 18px; border-bottom:1px solid var(--border); }
.logo-title { font-family:'Outfit',sans-serif; font-weight:800; font-size:17px; letter-spacing:-0.5px; }
.logo-title span { color:var(--accent); }
.logo-sub { font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--text3); text-transform:uppercase; letter-spacing:2px; margin-top:3px; }

.nav-label { padding:16px 18px 6px; font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--text3); text-transform:uppercase; letter-spacing:2px; }
.nav-item {
  display:flex; align-items:center; gap:9px;
  padding:9px 12px; margin:1px 8px;
  border-radius:var(--r-sm); cursor:pointer;
  color:var(--text2); font-size:13px; font-weight:400;
  border:none; background:none; width:calc(100% - 16px); text-align:left;
  transition:all 0.15s;
}
.nav-item:hover { background:var(--bg3); color:var(--text); }
.nav-item.active { background:rgba(59,130,246,0.12); color:var(--accent); font-weight:500; }
.nav-item svg { width:15px; height:15px; flex-shrink:0; opacity:0.7; }
.nav-item.active svg { opacity:1; }

.sidebar-footer { margin-top:auto; padding:14px; border-top:1px solid var(--border); }
.src-pill { display:flex; align-items:center; gap:7px; padding:6px 10px; border-radius:var(--r-sm); margin-bottom:5px; font-family:'JetBrains Mono',monospace; font-size:10px; }
.src-pill.mon { background:rgba(167,139,250,0.08); color:var(--mon); }
.src-pill.inc { background:rgba(52,211,153,0.08); color:var(--inc); }
.dot { width:5px; height:5px; border-radius:50%; background:currentColor; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }

/* MAIN */
.main { margin-left:210px; min-height:100vh; position:relative; z-index:1; }
.topbar {
  position:sticky; top:0; z-index:50;
  background:rgba(7,9,16,0.9); backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  padding:12px 28px; display:flex; align-items:center; justify-content:space-between;
}
.page-title { font-weight:700; font-size:16px; }
.topbar-right { display:flex; align-items:center; gap:10px; }
.topbar-meta { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text3); }

select {
  background:var(--bg3); border:1px solid var(--border2);
  border-radius:var(--r-sm); color:var(--text); font-size:12px;
  padding:5px 10px; cursor:pointer; font-family:'Outfit',sans-serif; outline:none;
  transition:border-color 0.15s;
}
select:focus { border-color:var(--accent); }
.btn {
  display:flex; align-items:center; gap:6px;
  padding:6px 14px; background:var(--bg3);
  border:1px solid var(--border2); border-radius:var(--r-sm);
  color:var(--text2); font-size:12px; cursor:pointer;
  font-family:'Outfit',sans-serif; transition:all 0.15s;
}
.btn:hover { background:var(--bg4); color:var(--text); border-color:var(--accent); }
.btn svg { width:13px; height:13px; }

/* SECTIONS */
.section { display:none; padding:24px 28px; animation:fadeIn 0.2s ease; }
.section.active { display:block; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none} }

/* CARDS */
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:24px; }
.card {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:var(--r); padding:16px 18px;
  position:relative; overflow:hidden; transition:border-color 0.2s;
}
.card:hover { border-color:var(--border2); }
.card::after {
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg,transparent,var(--c,var(--accent)),transparent);
}
.card.g { --c:var(--green); }
.card.a { --c:var(--amber); }
.card.r { --c:var(--red); }
.card.m { --c:var(--mon); }
.card.i { --c:var(--inc); }
.card-label { font-family:'JetBrains Mono',monospace; font-size:9px; text-transform:uppercase; letter-spacing:1.5px; color:var(--text3); margin-bottom:8px; }
.card-val { font-family:'Outfit',sans-serif; font-weight:800; font-size:26px; color:var(--text); line-height:1; }
.card-sub { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text3); margin-top:5px; }

/* TABLE */
.tbl-wrap { background:var(--bg2); border:1px solid var(--border); border-radius:var(--r); overflow:hidden; margin-bottom:20px; }
.tbl-header { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border); }
.tbl-title { font-weight:600; font-size:13px; color:var(--text2); text-transform:uppercase; letter-spacing:0.5px; font-family:'JetBrains Mono',monospace; font-size:10px; }
.filters { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.filters label { font-size:11px; color:var(--text3); font-family:'JetBrains Mono',monospace; }
table { width:100%; border-collapse:collapse; }
th { padding:10px 14px; text-align:left; font-family:'JetBrains Mono',monospace; font-size:9px; text-transform:uppercase; letter-spacing:1.5px; color:var(--text3); border-bottom:1px solid var(--border); white-space:nowrap; }
td { padding:10px 14px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; }
tbody tr:last-child td { border-bottom:none; }
tbody tr:hover { background:var(--bg3); }

/* BAR */
.bar-wrap { display:flex; align-items:center; gap:8px; }
.bar-bg { flex:1; height:4px; background:var(--bg4); border-radius:2px; min-width:50px; }
.bar-fill { height:100%; border-radius:2px; transition:width 0.6s ease; }
.bar-lbl { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text2); min-width:32px; }

/* BADGES */
.badge { display:inline-flex; align-items:center; padding:2px 8px; border-radius:20px; font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:500; white-space:nowrap; }
.badge.ok   { background:rgba(16,185,129,0.12); color:var(--green); }
.badge.warn { background:rgba(245,158,11,0.12); color:var(--amber); }
.badge.bad  { background:rgba(239,68,68,0.12); color:var(--red); }
.badge.nd   { background:var(--bg4); color:var(--text3); }
.badge.mon  { background:rgba(167,139,250,0.12); color:var(--mon); }
.badge.inc  { background:rgba(52,211,153,0.12); color:var(--inc); }
.badge.b1   { background:rgba(59,130,246,0.12); color:var(--accent); font-size:9px; padding:2px 6px; }
.badge.b2   { background:rgba(167,139,250,0.12); color:var(--mon); font-size:9px; padding:2px 6px; }

/* CHARTS */
.charts-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px; }
.chart-box { background:var(--bg2); border:1px solid var(--border); border-radius:var(--r); padding:18px 20px; }
.chart-box-title { font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:1.5px; color:var(--text2); margin-bottom:14px; }
canvas { width:100%!important; }


/* FECHA FILTER */
.date-filter { display:flex; align-items:center; gap:10px; margin-bottom:20px; flex-wrap:wrap; background:var(--bg2); border:1px solid var(--border); border-radius:var(--r); padding:14px 18px; }
.date-filter label { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:1px; }
.date-filter input[type=date] { background:var(--bg3); border:1px solid var(--border2); border-radius:var(--r-sm); color:var(--text); font-size:12px; padding:5px 10px; font-family:'Outfit',sans-serif; outline:none; cursor:pointer; }
.date-filter input[type=date]:focus { border-color:var(--accent); }
.date-btns { display:flex; gap:6px; margin-left:auto; }
.date-btn { padding:5px 12px; border-radius:var(--r-sm); border:1px solid var(--border2); background:var(--bg3); color:var(--text2); font-size:11px; cursor:pointer; font-family:'Outfit',sans-serif; transition:all 0.15s; }
.date-btn:hover, .date-btn.active { background:rgba(59,130,246,0.15); color:var(--accent); border-color:var(--accent); }

/* DESPEGA TABLE */
.despega-wrap { background:var(--bg2); border:1px solid var(--border); border-radius:var(--r); overflow:hidden; margin-bottom:20px; }
.despega-header { background:linear-gradient(135deg, #1a3a6b 0%, #1e4d8c 100%); padding:16px 20px; display:flex; align-items:center; justify-content:space-between; }
.despega-title { font-weight:700; font-size:15px; color:#fff; }
.despega-date { font-family:'JetBrains Mono',monospace; font-size:11px; color:rgba(255,255,255,0.7); background:rgba(255,255,255,0.15); padding:4px 12px; border-radius:20px; }
.despega-table { width:100%; border-collapse:collapse; }
.despega-table thead tr { background:rgba(30,77,140,0.3); }
.despega-table th { padding:11px 16px; text-align:left; font-size:11px; font-weight:600; color:var(--text2); text-transform:uppercase; letter-spacing:1px; border-bottom:1px solid var(--border); }
.despega-table td { padding:12px 16px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; }
.despega-table tbody tr:last-child td { border-bottom:none; }
.despega-table tbody tr:hover { background:var(--bg3); }
.tipo-icon { width:28px; height:28px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; margin-right:8px; flex-shrink:0; font-size:13px; }
.tipo-cell { display:flex; align-items:center; }
.cumpl-badge { display:inline-flex; align-items:center; padding:4px 12px; border-radius:20px; font-weight:600; font-size:13px; }
.cumpl-ok   { background:rgba(16,185,129,0.15); color:#10b981; border:1px solid rgba(16,185,129,0.3); }
.cumpl-warn { background:rgba(245,158,11,0.15); color:#f59e0b; border:1px solid rgba(245,158,11,0.3); }
.cumpl-bad  { background:rgba(239,68,68,0.15); color:#ef4444; border:1px solid rgba(239,68,68,0.3); }
.cumpl-nd   { background:var(--bg4); color:var(--text3); }

/* LOADER */
.loader { padding:48px; text-align:center; color:var(--text3); }
.spinner { width:26px; height:26px; border:2px solid var(--border2); border-top-color:var(--accent); border-radius:50%; animation:spin 0.7s linear infinite; margin:0 auto 10px; }
@keyframes spin { to{transform:rotate(360deg)} }
.err { background:rgba(239,68,68,0.08); border:1px solid rgba(239,68,68,0.2); border-radius:var(--r); padding:14px 18px; color:var(--red); font-size:13px; margin-bottom:16px; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">
    <div class="logo-title">SLA<span>.</span>Center</div>
    <div class="logo-sub">Monitoreo CE</div>
  </div>
  <div class="nav-label">Vistas</div>
  <button class="nav-item active" onclick="nav('resumen',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    Resumen
  </button>
  <button class="nav-item" onclick="nav('monitoreo',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    SLA Monitoreo
  </button>
  <button class="nav-item" onclick="nav('incidencias',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    SLA Incidencias
  </button>
  <button class="nav-item" onclick="nav('detalle',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    Detalle casos
  </button>
  <div class="sidebar-footer">
    <div class="src-pill mon"><div class="dot"></div>Monitoreo (hoja SLA)</div>
    <div class="src-pill inc"><div class="dot"></div>Incidencias (Script)</div>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div>
      <div class="page-title" id="page-title">Resumen combinado</div>
      <div class="topbar-meta" id="last-update">Cargando...</div>
    </div>
    <div class="topbar-right">
      <label class="topbar-meta">Bloque</label>
      <select id="g-bloque" onchange="rerender()">
        <option value="all">B1 + B2</option>
        <option value="B1">B1</option>
        <option value="B2">B2</option>
      </select>
      <button class="btn" onclick="loadAll()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.4"/></svg>
        Actualizar
      </button>
    </div>
  </div>

  <!-- RESUMEN -->
  <section class="section active" id="sec-resumen">
    <!-- Filtro fechas -->
    <div class="date-filter">
      <label>Desde</label>
      <input type="date" id="f-desde" onchange="rerender()">
      <label>Hasta</label>
      <input id="f-hasta" type="date" onchange="rerender()">
      <div class="date-btns">
        <button class="date-btn" onclick="setFecha('hoy')">Hoy</button>
        <button class="date-btn" onclick="setFecha('ayer')">Ayer</button>
        <button class="date-btn" onclick="setFecha('3dias')">3 días</button>
        <button class="date-btn" onclick="setFecha('semana')">Semana</button>
        <button class="date-btn active" onclick="setFecha('todo')">Todo</button>
      </div>
    </div>
    <!-- Cards -->
    <div id="r-cards" class="cards"><div class="loader"><div class="spinner"></div></div></div>
    <!-- Gráfica combinada -->
    <div class="tbl-wrap" style="margin-bottom:20px">
      <div class="tbl-header"><span class="tbl-title">% SLA Combinado (Mon + Inc)</span></div>
      <div style="padding:16px 20px;height:220px"><canvas id="cCombinado"></canvas></div>
    </div>
    <!-- Tabla estilo CE Despega -->
    <div class="despega-wrap">
      <div class="despega-header">
        <span class="despega-title">Estado de incidencias por tipo</span>
        <span class="despega-date" id="despega-rango">Histórico completo</span>
      </div>
      <div id="r-tabla"><div class="loader"><div class="spinner"></div></div></div>
    </div>
  </section>

  <!-- MONITOREO -->
  <section class="section" id="sec-monitoreo">
    <div class="date-filter">
      <label>Desde</label>
      <input type="date" id="m-desde" onchange="renderMon()">
      <label>Hasta</label>
      <input type="date" id="m-hasta" onchange="renderMon()">
      <div class="date-btns">
        <button class="date-btn" onclick="setFechaSection('m','hoy')">Hoy</button>
        <button class="date-btn" onclick="setFechaSection('m','ayer')">Ayer</button>
        <button class="date-btn" onclick="setFechaSection('m','3dias')">3 días</button>
        <button class="date-btn" onclick="setFechaSection('m','semana')">Semana</button>
        <button class="date-btn active" onclick="setFechaSection('m','todo')">Todo</button>
      </div>
    </div>
    <div id="m-cards" class="cards" style="margin-bottom:16px"></div>
    <div class="despega-wrap">
      <div class="despega-header" style="background:linear-gradient(135deg,#1a3a6b 0%,#1e4d8c 100%)">
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
          <span class="despega-title">SLA Monitoreo</span>
          <div style="display:flex;align-items:center;gap:8px">
            <label style="font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,0.6)">Tipo</label>
            <select id="m-tipo" onchange="renderMon()" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:11px;padding:3px 8px;border-radius:6px"><option value="all">Todos</option></select>
            <label style="font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,0.6)">Estado</label>
            <select id="m-estado" onchange="renderMon()" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:11px;padding:3px 8px;border-radius:6px">
              <option value="all">Todos</option>
              <option value="cerrado">Cerrado</option>
              <option value="abierto">Abierto</option>
            </select>
          </div>
        </div>
        <span class="despega-date" id="m-rango">Histórico completo</span>
      </div>
      <div id="m-tabla"></div>
    </div>
  </section>

  <!-- INCIDENCIAS -->
  <section class="section" id="sec-incidencias">
    <div class="date-filter">
      <label>Desde</label>
      <input type="date" id="i-desde" onchange="renderInc()">
      <label>Hasta</label>
      <input type="date" id="i-hasta" onchange="renderInc()">
      <div class="date-btns">
        <button class="date-btn" onclick="setFechaSection('i','hoy')">Hoy</button>
        <button class="date-btn" onclick="setFechaSection('i','ayer')">Ayer</button>
        <button class="date-btn" onclick="setFechaSection('i','3dias')">3 días</button>
        <button class="date-btn" onclick="setFechaSection('i','semana')">Semana</button>
        <button class="date-btn active" onclick="setFechaSection('i','todo')">Todo</button>
      </div>
    </div>
    <div id="i-cards" class="cards" style="margin-bottom:16px"></div>
    <div class="despega-wrap">
      <div class="despega-header" style="background:linear-gradient(135deg,#0d3d2e 0%,#0f5c40 100%)">
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
          <span class="despega-title">SLA Incidencias</span>
          <div style="display:flex;align-items:center;gap:8px">
            <label style="font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,0.6)">Tipo</label>
            <select id="i-tipo" onchange="renderInc()" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:11px;padding:3px 8px;border-radius:6px"><option value="all">Todos</option></select>
          </div>
        </div>
        <span class="despega-date" id="i-rango">Histórico completo</span>
      </div>
      <div id="i-tabla"></div>
    </div>
  </section>

  <!-- DETALLE -->
  <section class="section" id="sec-detalle">
    <div class="date-filter">
      <label>Desde</label>
      <input type="date" id="d-desde" onchange="renderDet()">
      <label>Hasta</label>
      <input type="date" id="d-hasta" onchange="renderDet()">
      <div class="date-btns">
        <button class="date-btn" onclick="setFechaSection('d','hoy')">Hoy</button>
        <button class="date-btn" onclick="setFechaSection('d','ayer')">Ayer</button>
        <button class="date-btn" onclick="setFechaSection('d','3dias')">3 días</button>
        <button class="date-btn" onclick="setFechaSection('d','semana')">Semana</button>
        <button class="date-btn active" onclick="setFechaSection('d','todo')">Todo</button>
      </div>
    </div>
    <div class="tbl-wrap">
      <div class="tbl-header" style="flex-wrap:wrap;gap:8px">
        <span class="tbl-title">Detalle — Mon + Inc</span>
        <div class="filters" style="flex-wrap:wrap">
          <label>COD</label>
          <input type="text" id="d-cod" oninput="renderDet()" placeholder="ej. 10438"
            style="background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-sm);color:var(--text);font-size:12px;padding:5px 10px;outline:none;width:110px;font-family:'Outfit',sans-serif">
          <label>Fuente</label>
          <select id="d-fuente" onchange="renderDet()">
            <option value="all">Todas</option>
            <option value="mon">Monitoreo</option>
            <option value="inc">Incidencias</option>
          </select>
          <label>Monitor</label>
          <select id="d-monitor" onchange="renderDet()"><option value="all">Todos</option></select>
          <label>Tipo</label>
          <select id="d-tipo" onchange="renderDet()"><option value="all">Todos</option></select>
          <label>Estado</label>
          <select id="d-estado" onchange="renderDet()">
            <option value="all">Todos</option>
            <option value="cerrado">Cerrado</option>
            <option value="abierto">Abierto</option>
          </select>
        </div>
      </div>
      <div id="d-tabla"></div>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const URL_MON = 'https://script.google.com/macros/s/AKfycbzYkS6QUFYIQNHzLQLmKZ85ccfMYWXNPrvsw0dKX62k33c0IGVHD64ybDo2z8SSbzOWJA/exec';
const URL_INC = 'https://script.google.com/macros/s/AKfycbx3FbzfNY9Cnqy6U5wjEobSApFRX9WC9Y__ZUFfihNdoQnQzjLz5IakqTxP84KTCPY/exec?action=data';

const SLA_IDEAL = {
  'apoyo a usuario':3,
  'reconfiguracion lan (mined)':4,
  'limite de sesiones alcanzado':3,
  'cambio de equipos (mined)':12,
  'corte de fibra optica':48,
  'cambio de equipos (isp)':48,
  'reconfiguracion wan (isp)':48
};

let RAW_MON=[], RAW_INC=[], RAW_INC_FILAS=[], cMonI=null, cIncI=null;

const norm = s => !s?'':s.toLowerCase().trim()
  .replace(/á/g,'a').replace(/é/g,'e').replace(/í/g,'i')
  .replace(/ó/g,'o').replace(/ú/g,'u').replace(/ü/g,'u');

function parseDur(s) {
  if(!s) return 0; s=String(s).trim();
  let m=s.match(/(\d+)\s*h\s*(\d+)\s*min/i); if(m) return +m[1]+ +m[2]/60;
  m=s.match(/^(\d+(?:\.\d+)?)\s*h$/i); if(m) return parseFloat(m[1]);
  m=s.match(/^(\d+)\s*min$/i); if(m) return +m[1]/60;
  const n=parseFloat(s); return isNaN(n)?0:n;
}

function pctColor(p) { return p===null?'#3d4560':p>=80?'#10b981':p>=50?'#f59e0b':'#ef4444'; }

function badge(p) {
  if(p===null) return '<span class="badge nd">S/D</span>';
  if(p>=80)    return `<span class="badge ok">${p}%</span>`;
  if(p>=50)    return `<span class="badge warn">${p}%</span>`;
  return `<span class="badge bad">${p}%</span>`;
}

function bar(p) {
  const w=p??0, c=pctColor(p);
  return `<div class="bar-wrap"><div class="bar-bg"><div class="bar-fill" style="width:${w}%;background:${c}"></div></div><span class="bar-lbl">${p!==null?p+'%':'—'}</span></div>`;
}

function card(label,val,sub='',cls='') {
  return `<div class="card ${cls}"><div class="card-label">${label}</div><div class="card-val">${val}</div>${sub?`<div class="card-sub">${sub}</div>`:''}</div>`;
}

function fmtFecha(iso) { return !iso?'—':String(iso).substring(0,10); }

const TITLES = {resumen:'Resumen combinado',monitoreo:'SLA Monitoreo',incidencias:'SLA Incidencias',detalle:'Detalle casos'};
function nav(id,btn) {
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  document.getElementById('sec-'+id).classList.add('active');
  btn.classList.add('active');
  document.getElementById('page-title').textContent=TITLES[id];
}

function setFecha(rango) {
  const hoy = new Date();
  const fmt = d => d.toISOString().split('T')[0];
  let desde, hasta = fmt(hoy);
  if (rango==='hoy')   { desde = fmt(hoy); }
  else if (rango==='ayer')  { const a=new Date(hoy); a.setDate(a.getDate()-1); desde=fmt(a); hasta=fmt(a); }
  else if (rango==='3dias') { const a=new Date(hoy); a.setDate(a.getDate()-2); desde=fmt(a); }
  else if (rango==='semana'){ const a=new Date(hoy); a.setDate(a.getDate()-6); desde=fmt(a); }
  else { desde=''; hasta=''; }
  document.getElementById('f-desde').value = desde;
  document.getElementById('f-hasta').value = hasta;
  document.querySelectorAll('.date-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  rerender();
}

function getFechaFiltro() {
  return {
    desde: document.getElementById('f-desde')?.value || '',
    hasta: document.getElementById('f-hasta')?.value || ''
  };
}

function getFechaFiltroSection(prefix) {
  return {
    desde: document.getElementById(prefix+'-desde')?.value || '',
    hasta: document.getElementById(prefix+'-hasta')?.value || ''
  };
}

function setFechaSection(prefix, rango) {
  const hoy = new Date();
  const fmt = d => d.toISOString().split('T')[0];
  let desde = '', hasta = fmt(hoy);
  if (rango==='hoy')    { desde = fmt(hoy); }
  else if (rango==='ayer')   { const a=new Date(hoy); a.setDate(a.getDate()-1); desde=fmt(a); hasta=fmt(a); }
  else if (rango==='3dias')  { const a=new Date(hoy); a.setDate(a.getDate()-2); desde=fmt(a); }
  else if (rango==='semana') { const a=new Date(hoy); a.setDate(a.getDate()-6); desde=fmt(a); }
  else { desde=''; hasta=''; }
  document.getElementById(prefix+'-desde').value = desde;
  document.getElementById(prefix+'-hasta').value = hasta;
  const container = event.target.closest('.date-filter');
  container.querySelectorAll('.date-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  if(prefix==='m') renderMon();
  else if(prefix==='i') renderInc();
  else if(prefix==='d') renderDet();
}

function rerender() { renderResumen(); renderMon(); renderInc(); renderDet(); }

// ── LOAD ─────────────────────────────────────────────────────────────────────
async function loadAll() {
  document.getElementById('last-update').textContent='Cargando...';
  try {
    const [rMon, rInc] = await Promise.all([
      fetch(URL_MON).then(r=>r.json()),
      fetch(URL_INC).then(r=>r.json()).catch(()=>({tipos:[]}))
    ]);

    // Monitoreo: filtrar B1 y B2 de hoja SLA
    RAW_MON = (rMon.sla||[]).filter(r=>{
      const b=(r['Bloque']||'').trim();
      return b==='B1'||b==='B2'||b==='';
    });

    // Incidencias: viene como array de filas, calculamos SLA por tipo
    const filasInc = Array.isArray(rInc) ? rInc : [];
    RAW_INC_FILAS = filasInc;
    const SLA_KEYS = Object.keys(SLA_IDEAL);
    const acum = {};
    SLA_KEYS.forEach(t => { acum[t] = {cumple:0,noCumple:0,abiertos:0,total:0,sumaHoras:0,nHoras:0}; });
    const normI = s => !s?'':s.toLowerCase().trim().replace(/á/g,'a').replace(/é/g,'e').replace(/í/g,'i').replace(/ó/g,'o').replace(/ú/g,'u').replace(/ü/g,'u');
    filasInc.forEach(r => {
      const tKey = normI(r.tipo||'');
      if (!acum[tKey]) return;
      acum[tKey].total++;
      if ((r.estado||'').toUpperCase() !== 'CERRADO') { acum[tKey].abiertos++; return; }
      const slaReal = parseDur(r.sla_texto||'');
      const slaIdeal = SLA_IDEAL[tKey];
      if (slaReal <= 0) return;
      acum[tKey].sumaHoras+=slaReal; acum[tKey].nHoras++;
      if (slaReal <= slaIdeal) acum[tKey].cumple++;
      else acum[tKey].noCumple++;
    });
    RAW_INC = SLA_KEYS.map(t => {
      const a = acum[t];
      const cerrados = a.cumple + a.noCumple;
      return {
        tipo:t, label:t, total:a.total, cerrados, abiertos:a.abiertos,
        cumple:a.cumple, noCumple:a.noCumple, slaIdeal:SLA_IDEAL[t],
        slaPct: cerrados>0 ? Math.round((a.cumple/cerrados)*100) : null,
        conTiempo: cerrados,
        sumaHoras: a.sumaHoras, nHoras: a.nHoras
      };
    });

    // Poblar filtros
    fill('m-tipo',[...new Set(RAW_MON.map(r=>r['Motivo de solución']||r['Incidencias']).filter(Boolean))].sort());
    fill('d-monitor',[...new Set(RAW_MON.map(r=>r['Monitor']).filter(Boolean))].sort());
    fill('d-tipo',[...new Set(RAW_MON.map(r=>r['Motivo de solución']||r['Incidencias']).filter(Boolean))].sort());
    fill('i-tipo',RAW_INC.map(d=>d.tipo));

    renderResumen(); renderMon(); renderInc(); renderDet();
    document.getElementById('last-update').textContent='Actualizado: '+new Date().toLocaleTimeString('es-SV');
  } catch(e) {
    document.getElementById('r-cards').innerHTML=`<div class="err">Error: ${e.message}</div>`;
    document.getElementById('last-update').textContent='Error al cargar';
  }
}

function fill(id, vals) {
  const sel=document.getElementById(id);
  const cur=sel.value;
  while(sel.options.length>1) sel.remove(1);
  vals.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.text=v; sel.appendChild(o); });
  if([...sel.options].some(o=>o.value===cur)) sel.value=cur;
}

// ── FILTROS ───────────────────────────────────────────────────────────────────
function getMonRows() {
  const bloque=document.getElementById('g-bloque').value;
  const tipo=document.getElementById('m-tipo')?.value||'all';
  const estado=document.getElementById('m-estado')?.value||'all';
  const {desde, hasta} = getFechaFiltroSection('m');
  return RAW_MON.filter(r=>{
    const b=(r['Bloque']||'').trim();
    if(bloque!=='all'&&b!==bloque) return false;
    if(tipo!=='all'&&(r['Motivo de solución']||r['Incidencias']||'').trim()!==tipo) return false;
    if(estado!=='all'&&norm(r['Estado']||'')!==estado) return false;
    const f = fmtFecha(r['Fecha']);
    if(desde && f < desde) return false;
    if(hasta && f > hasta) return false;
    return true;
  });
}

function calcMon(rows) {
  let total=0,cerr=0,cumple=0,con=0;
  rows.forEach(r=>{
    total++;
    if(norm(r['Estado']||'')==='cerrado'){
      cerr++;
      const tN=norm(r['Motivo de solución']||r['Incidencias']||r['Tipo']||'');
      const ideal=SLA_IDEAL[tN];
      const dur=parseDur(r['Duración']);
      if(ideal!==undefined&&dur>0){con++;if(dur<=ideal)cumple++;}
    }
  });
  return{total,cerrados:cerr,abiertos:total-cerr,cumple,con,pct:con>0?Math.round(cumple/con*100):null};
}

function calcInc(rows) {
  let total=0,cerr=0,ab=0,cumple=0,con=0;
  rows.forEach(d=>{total+=d.total;cerr+=d.cerrados;ab+=d.abiertos;cumple+=d.cumple;con+=d.conTiempo;});
  return{total,cerrados:cerr,abiertos:ab,cumple,con,pct:con>0?Math.round(cumple/con*100):null};
}

// ── RESUMEN ───────────────────────────────────────────────────────────────────
function getMonRowsFiltrados() {
  const {desde, hasta} = getFechaFiltro();
  const bloque = document.getElementById('g-bloque').value;
  return RAW_MON.filter(r => {
    const b=(r['Bloque']||'').trim();
    if(bloque!=='all'&&b!==bloque) return false;
    const f = fmtFecha(r['Fecha']);
    if(desde && f < desde) return false;
    if(hasta && f > hasta) return false;
    return true;
  });
}

function getIncRowsFiltrados() {
  // Para incidencias filtramos las filas raw por fecha
  const {desde, hasta} = getFechaFiltro();
  if (!desde && !hasta) return RAW_INC;
  // Recalcular desde RAW_INC_FILAS
  return calcIncDesdeFilas(RAW_INC_FILAS, desde, hasta);
}

function calcIncDesdeFilas(filas, desde, hasta) {
  const SLA_KEYS = Object.keys(SLA_IDEAL);
  const acum = {};
  SLA_KEYS.forEach(t => { acum[t] = {cumple:0,noCumple:0,abiertos:0,total:0,sumaHoras:0,nHoras:0}; });
  filas.forEach(r => {
    const f = r.fecha_reporte||'';
    if(desde && f < desde) return;
    if(hasta && f > hasta) return;
    const tKey = norm(r.tipo||'');
    if(!acum[tKey]) return;
    acum[tKey].total++;
    if((r.estado||'').toUpperCase()!=='CERRADO'){acum[tKey].abiertos++;return;}
    const slaReal=parseDur(r.sla_texto||''), slaIdeal=SLA_IDEAL[tKey];
    if(slaReal<=0) return;
    acum[tKey].sumaHoras+=slaReal; acum[tKey].nHoras++;
    if(slaReal<=slaIdeal)acum[tKey].cumple++;else acum[tKey].noCumple++;
  });
  return SLA_KEYS.map(t=>{
    const a=acum[t], cerrados=a.cumple+a.noCumple;
    const tipoNombre=TIPO_MAP[t]||t;
    return{tipo:tipoNombre,label:tipoNombre,total:a.total,cerrados,abiertos:a.abiertos,
      cumple:a.cumple,noCumple:a.noCumple,slaIdeal:SLA_IDEAL[t],
      slaPct:cerrados>0?Math.round((a.cumple/cerrados)*100):null,conTiempo:cerrados,
      sumaHoras:a.sumaHoras,nHoras:a.nHoras};
  });
}

const TIPO_MAP = {
  'apoyo a usuario': 'Apoyo a usuario',
  'reconfiguracion lan (mined)': 'Reconfiguración LAN (MINED)',
  'limite de sesiones alcanzado': 'Límite de sesiones alcanzado',
  'cambio de equipos (mined)': 'Cambio de equipos (MINED)',
  'corte de fibra optica': 'Corte de fibra óptica',
  'cambio de equipos (isp)': 'Cambio de equipos (ISP)',
  'reconfiguracion wan (isp)': 'Reconfiguración WAN (ISP)'
};

function normTipo(s) {
  return norm(s).replace(/\s+/g, ' ').trim();
}

const TIPO_ICONS = {
  'Apoyo a usuario': '👤',
  'Reconfiguración LAN (MINED)': '🔧',
  'Límite de sesiones alcanzado': '🔒',
  'Corte de fibra óptica': '✂️',
  'Cambio de equipos (MINED)': '🖥️',
  'Reconfiguración WAN (ISP)': '🌐',
  'Cambio de equipos (ISP)': '⚙️',
};

function fmtHoras(h) {
  if(!h || h===0) return '—';
  if(h < 1) return Math.round(h*60)+'min';
  const hrs = Math.floor(h), mins = Math.round((h-hrs)*60);
  return mins>0 ? `${hrs}h ${mins}min` : `${hrs}h`;
}

function renderResumen() {
  const monRows = getMonRowsFiltrados();
  const {desde, hasta} = getFechaFiltro();

  // Calcular incidencias filtradas
  const incRows = calcIncDesdeFilas(RAW_INC_FILAS, desde, hasta);

  const sm = calcMon(monRows), si = calcInc(incRows);
  const cumG=sm.cumple+si.cumple, conG=sm.con+si.con;
  const pctG=conG>0?Math.round(cumG/conG*100):null;
  const cls=p=>p===null?'':p>=80?'g':p>=50?'a':'r';

  document.getElementById('r-cards').innerHTML=
    card('Total casos',sm.total+si.total,'ambas fuentes')+
    card('SLA Global',pctG!==null?pctG+'%':'—',`${cumG}/${conG} cumplen`,cls(pctG))+
    card('SLA Monitoreo',sm.pct!==null?sm.pct+'%':'—',`${sm.cumple}/${sm.con}`,'m')+
    card('SLA Incidencias',si.pct!==null?si.pct+'%':'—',`${si.cumple}/${si.con}`,'i')+
    card('Cerrados',sm.cerrados+si.cerrados,'')+
    card('Abiertos',sm.abiertos+si.abiertos,'');

  // Rango texto
  const rangoTxt = desde||hasta ? `${desde||'...'} → ${hasta||'...'}` : 'Histórico completo';
  document.getElementById('despega-rango').textContent = rangoTxt;

  // Gráfica combinada
  const TIPOS_LABEL = Object.values(TIPO_MAP);
  const datComb = TIPOS_LABEL.map(t => {
    const tN = norm(t);
    // Mon
    let cM=0,nM=0;
    monRows.forEach(r=>{
      if(norm(r['Motivo de solución']||r['Incidencias']||'')!==tN) return;
      const dur=parseDur(r['Duración']), ideal=SLA_IDEAL[tN], cerr=norm(r['Estado']||'')==='cerrado';
      if(cerr&&dur>0&&ideal!==undefined){nM++;if(dur<=ideal)cM++;}
    });
    // Inc
    const dI = incRows.find(d=>norm(d.tipo)===tN);
    const cI=dI?dI.cumple:0, nI=dI?dI.conTiempo:0;
    const cG=cM+cI, nG=nM+nI;
    return nG>0?Math.round(cG/nG*100):null;
  });

  if(window.cCombInst) window.cCombInst.destroy();
  window.cCombInst = new Chart(document.getElementById('cCombinado'),{
    type:'bar',
    data:{
      labels:TIPOS_LABEL.map(l=>l.length>18?l.slice(0,16)+'…':l),
      datasets:[{
        label:'% SLA Combinado',
        data:datComb,
        backgroundColor:datComb.map(v=>v===null?'rgba(61,69,96,0.5)':v>=80?'rgba(16,185,129,0.75)':v>=50?'rgba(245,158,11,0.75)':'rgba(239,68,68,0.75)'),
        borderRadius:5
      }]
    },
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.raw!==null?c.raw+'%':'Sin datos'}}},
      scales:{
        x:{ticks:{color:'#3d4560',font:{size:10}},grid:{color:'rgba(255,255,255,0.03)'}},
        y:{min:0,max:100,ticks:{color:'#3d4560',font:{size:10},callback:v=>v+'%'},grid:{color:'rgba(255,255,255,0.03)'}}
      }
    }
  });

  // Tabla estilo CE Despega
  let html = `<table class="despega-table"><thead><tr>
    <th>Incidencia</th><th>Total</th><th>SLA Ideal</th><th>Prom. Real</th><th>Cumplimiento</th>
  </tr></thead><tbody>`;

  TIPOS_LABEL.forEach(t => {
    const tN = norm(t);
    const ideal = SLA_IDEAL[tN];
    // Mon acumulado
    let cM=0,nM=0,sumaM=0;
    monRows.forEach(r=>{
      if(norm(r['Motivo de solución']||r['Incidencias']||'')!==tN) return;
      const dur=parseDur(r['Duración']), cerr=norm(r['Estado']||'')==='cerrado';
      if(cerr&&dur>0&&ideal!==undefined){nM++;sumaM+=dur;if(dur<=ideal)cM++;}
    });
    // Inc
    const dI=incRows.find(d=>norm(d.tipo)===tN);
    const totalI=dI?dI.total:0, cI=dI?dI.cumple:0, nI=dI?dI.conTiempo:0;
    // Mon total for this tipo (from already-filtered monRows)
    const monTipoTotal=monRows.filter(r=>norm(r['Motivo de solución']||r['Incidencias']||'')===tN).length;
    const totalG=monTipoTotal+totalI;
    const cG=cM+cI, nG=nM+nI;
    const pG=nG>0?Math.round(cG/nG*100):null;
    const sumaI=dI?dI.sumaHoras:0, nI2=dI?dI.nHoras:0;
    const sumaTotal=sumaM+sumaI, nTotal=nM+nI2;
    const promReal=nTotal>0?fmtHoras(sumaTotal/nTotal):'—';
    const icon=TIPO_ICONS[t]||'📋';

    let cumplBadge;
    if(pG===null) cumplBadge='<span class="cumpl-badge cumpl-nd">—</span>';
    else if(pG>=80) cumplBadge=`<span class="cumpl-badge cumpl-ok">${pG}%</span>`;
    else if(pG>=50) cumplBadge=`<span class="cumpl-badge cumpl-warn">${pG}%</span>`;
    else cumplBadge=`<span class="cumpl-badge cumpl-bad">${pG}%</span>`;

    html+=`<tr>
      <td><div class="tipo-cell"><span style="font-size:18px;margin-right:10px">${icon}</span><span style="font-weight:500">${t}</span></div></td>
      <td style="font-weight:600;font-size:15px">${totalG}</td>
      <td style="font-family:'JetBrains Mono',monospace;color:var(--text2)">${ideal?ideal+'h':'—'}</td>
      <td style="font-family:'JetBrains Mono',monospace;color:var(--text2)">${promReal}</td>
      <td>${cumplBadge}</td>
    </tr>`;
  });

  document.getElementById('r-tabla').innerHTML=html+'</tbody></table>';
}

// ── MONITOREO ─────────────────────────────────────────────────────────────────
function renderMon() {
  const rows=getMonRows(), s=calcMon(rows);
  const cls=p=>p===null?'':p>=80?'g':p>=50?'a':'r';
  const {desde:mD,hasta:mH}=getFechaFiltroSection('m');
  const mRango=mD||mH?`${mD||'...'} → ${mH||'...'}`:'— Histórico completo —';
  if(document.getElementById('m-rango')) document.getElementById('m-rango').textContent=mRango;
  document.getElementById('m-cards').innerHTML=
    card('Total',s.total)+card('Cerrados',s.cerrados)+
    card('Abiertos',s.abiertos)+card('SLA',s.pct!==null?s.pct+'%':'—',`${s.cumple}/${s.con}`,cls(s.pct));

  if(!rows.length){document.getElementById('m-tabla').innerHTML='<div class="loader" style="padding:20px;color:var(--text3)">Sin registros</div>';return;}

  // Agrupar por tipo -- todos los 7 tipos siempre visibles
  const SLA_KEYS_M = Object.keys(SLA_IDEAL);
  const agr = {};
  SLA_KEYS_M.forEach(k => {
    agr[k] = {t: TIPO_MAP[k]||k, ideal: SLA_IDEAL[k], total:0, cerr:0, abiertos:0, cumple:0, con:0, suma:0};
  });
  rows.forEach(r=>{
    const raw = (r['Motivo de solución']||r['Incidencias']||'').trim();
    const tKey = norm(raw);
    if(!agr[tKey]) return;
    const ideal = SLA_IDEAL[tKey];
    const dur = parseDur(r['Duración']), cerr = norm(r['Estado']||'')==='cerrado';
    agr[tKey].total++;
    if(cerr){ agr[tKey].cerr++; if(dur>0&&ideal!==undefined){ agr[tKey].con++; agr[tKey].suma+=dur; if(dur<=ideal)agr[tKey].cumple++; } }
    else agr[tKey].abiertos++;
  });
  const filas = SLA_KEYS_M.map(k => agr[k]);

  let mHtml = `<table class="despega-table"><thead><tr>
    <th>Tipo</th><th>Total</th><th>Cerrados</th><th>Abiertos</th><th>SLA Ideal</th><th>Prom. Real</th><th>Cumplimiento</th>
  </tr></thead><tbody>`;
  filas.forEach(f=>{
    const p=f.con>0?Math.round(f.cumple/f.con*100):null;
    const promM=f.con>0?fmtHoras(f.suma/f.con):'—';
    const icon=TIPO_ICONS[f.t]||'📋';
    let cumplBadge;
    if(p===null) cumplBadge='<span class="cumpl-badge cumpl-nd">—</span>';
    else if(p>=80) cumplBadge=`<span class="cumpl-badge cumpl-ok">${p}%</span>`;
    else if(p>=50) cumplBadge=`<span class="cumpl-badge cumpl-warn">${p}%</span>`;
    else cumplBadge=`<span class="cumpl-badge cumpl-bad">${p}%</span>`;
    mHtml+=`<tr>
      <td><div class="tipo-cell"><span style="font-size:18px;margin-right:10px">${icon}</span><span style="font-weight:500">${f.t}</span></div></td>
      <td style="font-weight:600;font-size:15px">${f.total}</td>
      <td style="font-weight:600;font-size:15px">${f.cerr}</td>
      <td style="font-size:14px">${f.abiertos}</td>
      <td style="font-family:'JetBrains Mono',monospace;color:var(--text2)">${f.ideal!==null?f.ideal+'h':'—'}</td>
      <td style="font-family:'JetBrains Mono',monospace;color:var(--text2)">${promM}</td>
      <td>${cumplBadge}</td>
    </tr>`;
  });
  document.getElementById('m-tabla').innerHTML=mHtml+'</tbody></table>';
}

// ── INCIDENCIAS ───────────────────────────────────────────────────────────────
function renderInc() {
  const tipo=document.getElementById('i-tipo')?.value||'all';
  const {desde, hasta} = getFechaFiltroSection('i');
  const rows = calcIncDesdeFilas(RAW_INC_FILAS, desde, hasta);
  if(tipo!=='all') rows=rows.filter(d=>norm(d.tipo)===norm(tipo)||d.tipo===tipo);
  const s=calcInc(rows);
  const cls=p=>p===null?'':p>=80?'g':p>=50?'a':'r';
  const {desde:iD,hasta:iH}=getFechaFiltroSection('i');
  const iRango=iD||iH?`${iD||'...'} → ${iH||'...'}`:'— Histórico completo —';
  if(document.getElementById('i-rango')) document.getElementById('i-rango').textContent=iRango;
  document.getElementById('i-cards').innerHTML=
    card('Total',s.total,'todos B1/B2')+card('Cerrados',s.cerrados)+
    card('Abiertos',s.abiertos)+card('SLA',s.pct!==null?s.pct+'%':'—',`${s.cumple}/${s.con}`,cls(s.pct));

  if(!rows.length){document.getElementById('i-tabla').innerHTML='<div class="loader" style="padding:20px;color:var(--text3)">Sin registros</div>';return;}

  let iHtml = `<table class="despega-table"><thead><tr>
    <th>Tipo</th><th>Total</th><th>Cerrados</th><th>Abiertos</th><th>SLA Ideal</th><th>Prom. Real</th><th>Cumplimiento</th>
  </tr></thead><tbody>`;
  const ORDEN_I=Object.keys(SLA_IDEAL);
  rows.sort((a,b)=>{
    const ia=ORDEN_I.indexOf(norm(a.tipo)), ib=ORDEN_I.indexOf(norm(b.tipo));
    return (ia===-1?99:ia)-(ib===-1?99:ib);
  }).forEach(d=>{
    const tN=norm(d.tipo), ideal=SLA_IDEAL[tN];
    const p=d.conTiempo>0?Math.round(d.cumple/d.conTiempo*100):null;
    const promI=d.nHoras>0?fmtHoras(d.sumaHoras/d.nHoras):'—';
    const icon=TIPO_ICONS[d.tipo]||'📋';
    let cumplBadge;
    if(p===null) cumplBadge='<span class="cumpl-badge cumpl-nd">—</span>';
    else if(p>=80) cumplBadge=`<span class="cumpl-badge cumpl-ok">${p}%</span>`;
    else if(p>=50) cumplBadge=`<span class="cumpl-badge cumpl-warn">${p}%</span>`;
    else cumplBadge=`<span class="cumpl-badge cumpl-bad">${p}%</span>`;
    iHtml+=`<tr>
      <td><div class="tipo-cell"><span style="font-size:18px;margin-right:10px">${icon}</span><span style="font-weight:500">${d.tipo}</span></div></td>
      <td style="font-weight:600;font-size:15px">${d.total}</td>
      <td style="font-weight:600;font-size:15px">${d.cerrados}</td>
      <td style="font-size:14px">${d.abiertos}</td>
      <td style="font-family:'JetBrains Mono',monospace;color:var(--text2)">${ideal!==undefined?ideal+'h':'—'}</td>
      <td style="font-family:'JetBrains Mono',monospace;color:var(--text2)">${promI}</td>
      <td>${cumplBadge}</td>
    </tr>`;
  });
  document.getElementById('i-tabla').innerHTML=iHtml+'</tbody></table>';
}

// -- DETALLE --
function renderDet() {
  const bloque  = document.getElementById('g-bloque').value;
  const monitor = document.getElementById('d-monitor')?.value||'all';
  const tipo    = document.getElementById('d-tipo')?.value||'all';
  const estado  = document.getElementById('d-estado')?.value||'all';
  const fuente  = document.getElementById('d-fuente')?.value||'all';
  const codBusq = (document.getElementById('d-cod')?.value||'').trim().toLowerCase();
  const {desde, hasta} = getFechaFiltroSection('d');

  // Filas Monitoreo
  const rowsMon = fuente==='inc' ? [] : RAW_MON.filter(r=>{
    const b=(r['Bloque']||'').trim();
    if(bloque!=='all'&&b!==bloque) return false;
    if(monitor!=='all'&&(r['Monitor']||'').trim()!==monitor) return false;
    if(tipo!=='all'&&norm(r['Motivo de solución']||r['Incidencias']||'')!==norm(tipo)) return false;
    if(estado!=='all'&&norm(r['Estado']||'')!==estado) return false;
    if(codBusq && !String(r['COD']||'').toLowerCase().includes(codBusq)) return false;
    const f=fmtFecha(r['Fecha']);
    if(desde && f<desde) return false;
    if(hasta && f>hasta) return false;
    return true;
  }).map(r=>({
    _src:'mon', fecha:fmtFecha(r['Fecha']),
    monitor:r['Monitor']||'—', cod:String(r['COD']||'—'),
    bloque:(r['Bloque']||'—').trim(),
    tipo:r['Motivo de solución']||r['Incidencias']||'—',
    desc:r['Descripción']||'—',
    durRaw:r['Duración']||'—', dur:parseDur(r['Duración']),
    cerrado:norm(r['Estado']||'')==='cerrado'
  }));

  // Filas Incidencias
  const rowsInc = fuente==='mon' ? [] : RAW_INC_FILAS.filter(r=>{
    if(estado!=='all'){
      const ec=(r.estado||'').toUpperCase()==='CERRADO';
      if(estado==='cerrado'&&!ec) return false;
      if(estado==='abierto'&&ec) return false;
    }
    if(tipo!=='all'&&norm(r.tipo||'')!==norm(tipo)) return false;
    if(codBusq && !String(r.id_ce||r.cod||'').toLowerCase().includes(codBusq)) return false;
    const f=(r.fecha_reporte||'').substring(0,10);
    if(desde && f<desde) return false;
    if(hasta && f>hasta) return false;
    return true;
  }).map(r=>({
    _src:'inc', fecha:(r.fecha_reporte||'—').substring(0,10),
    monitor:r.monitor||r.tecnico||'—',
    cod:String(r.id_ce||r.cod||'—'),
    bloque:r.bloque||'—',
    tipo:TIPO_MAP[norm(r.tipo||'')]||r.tipo||'—',
    desc:r.descripcion||r.detalle||'—',
    durRaw:r.sla_texto||'—', dur:parseDur(r.sla_texto||''),
    cerrado:(r.estado||'').toUpperCase()==='CERRADO'
  }));

  let rows = [...rowsMon, ...rowsInc].sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const total = rows.length;
  rows = rows.slice(0,300);

  if(!rows.length){
    document.getElementById('d-tabla').innerHTML='<div class="loader" style="padding:20px;color:var(--text3)">Sin registros</div>';
    return;
  }

  let html=`<div style="padding:8px 16px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text3);border-bottom:1px solid var(--border)">
    ${total} registro${total!==1?'s':''} encontrado${total!==1?'s':''}${total>300?' — mostrando 300':''}
  </div>
  <table><thead><tr>
    <th>Fuente</th><th>Fecha</th><th>Monitor</th><th>COD</th><th>Bloque</th><th>Tipo</th><th>Descripción</th><th>Duración</th><th>Estado</th><th>SLA</th>
  </tr></thead><tbody>`;

  rows.forEach(r=>{
    const tN=norm(r.tipo), ideal=SLA_IDEAL[tN];
    let slaTag='<span class="badge nd">—</span>';
    if(r.cerrado&&r.dur>0&&ideal!==undefined) slaTag=r.dur<=ideal?'<span class="badge ok">✓ Cumple</span>':'<span class="badge bad">✗ Fuera</span>';
    else if(!r.cerrado) slaTag='<span class="badge warn">Abierto</span>';
    const blq=r.bloque;
    const fuenteTag=r._src==='mon'
      ?'<span class="badge mon" style="font-size:9px">MON</span>'
      :'<span class="badge inc" style="font-size:9px">INC</span>';
    html+=`<tr>
      <td>${fuenteTag}</td>
      <td style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text2);white-space:nowrap">${r.fecha}</td>
      <td style="font-size:12px">${r.monitor}</td>
      <td style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent);font-weight:600">${r.cod}</td>
      <td><span class="badge ${blq==='B1'?'b1':blq==='B2'?'b2':'nd'}">${blq}</span></td>
      <td style="font-size:12px;font-weight:500">${r.tipo}</td>
      <td style="font-size:11px;color:var(--text2);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.desc}">${r.desc}</td>
      <td style="font-family:'JetBrains Mono',monospace;font-size:12px">${r.durRaw}</td>
      <td>${r.cerrado?'<span class="badge ok">Cerrado</span>':'<span class="badge warn">Abierto</span>'}</td>
      <td>${slaTag}</td>
    </tr>`;
  });
  document.getElementById('d-tabla').innerHTML=html+'</tbody></table>';
}

loadAll();
</script>
